<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Velozes e Furiosos X</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <header>
        <img id="logo" src="./LOGO.jpg" alt="Logo Velozes e Furiosos">

        <nav>
            <ul>
                <a href="./index.html"><li>Home</li></a>
                <a href="./contato.html"><li>Contato</li></a>
                <a href="./fotos.html"><li>Fotos</li></a>
                <a href="./comentarios.html"><li>Comentários</li></a>
            </ul>
        </nav>
    </header>

    <main class="contato-container">
        <h1>Entre em contato</h1>
        <p>Preencha o formulário abaixo para enviar uma mensagem.</p>

        <form class="formulario-contato" id="form-contato">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome">

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail">

            <label for="assunto">Assunto</label>
            <input type="text" id="assunto" name="assunto" placeholder="Digite o assunto">

            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem"></textarea>

            <button class="button" type="submit">Enviar mensagem</button>

            <p id="mensagem-formulario"></p>
        </form>
    </main>

    <footer>
        <img style="object-fit: contain;" id="logo" src="./LOGO.jpg" alt="Logo">

        <span>Todos os direitos reservados ©</span>
        <span>Desenvolvido por: Willian Moreira Knupp</span>

        <nav class="footer-navigation">
            <ul class="footer-list">
                <a href="./index.html"><li>Home</li></a>
                <a href="./contato.html"><li>Contato</li></a>
                <a href="./fotos.html"><li>Fotos</li></a>
                <a href="./comentarios.html"><li>Comentários</li></a>
            </ul>
        </nav>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
