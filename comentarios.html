<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comentários - Velozes e Furiosos X</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <header>
        <img id="logo" src="./LOGO.jpg" alt="Logo Velozes e Furiosos">

        <nav>
            <ul>
                <a href="./index.html"><li>Home</li></a>
                <a href="./contato.html"><li>Contato</li></a>
                <a href="./fotos.html"><li>Fotos</li></a>
                <a href="./comentarios.html"><li>Comentários</li></a>
            </ul>
        </nav>
    </header>

    <main class="comentarios-container">

        <h1>Comentários</h1>
        <p>Compartilhe sua opinião sobre Velozes e Furiosos X!</p>

        <form id="form-comentario">

            <label for="nome">Seu nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label>Sua avaliação:</label>
            <div class="estrelas">
                <input type="radio" name="avaliacao" id="estrela5" value="5" required>
                <label for="estrela5">★</label>

                <input type="radio" name="avaliacao" id="estrela4" value="4">
                <label for="estrela4">★</label>

                <input type="radio" name="avaliacao" id="estrela3" value="3">
                <label for="estrela3">★</label>

                <input type="radio" name="avaliacao" id="estrela2" value="2">
                <label for="estrela2">★</label>

                <input type="radio" name="avaliacao" id="estrela1" value="1">
                <label for="estrela1">★</label>
            </div>

            <label for="mensagem">Seu comentário:</label>
            <textarea id="mensagem" placeholder="Escreva sua opinião..." required></textarea>

            <button type="submit">Publicar comentário</button>

        </form>

        <section class="lista-comentarios">
            <h2>Opiniões dos visitantes</h2>
            <div id="comentarios-publicados"></div>
        </section>

    </main>

    <footer>
        <img style="object-fit: contain;" id="logo" src="./LOGO.jpg" alt="Logo">
        <span>Todos os direitos reservados ©</span>
        <span>Desenvolvido por: Willian Moreira Knupp</span>
    </footer>

    <script src="./comentarios.js"></script>

</body>
</html>
